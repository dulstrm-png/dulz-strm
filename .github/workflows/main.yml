name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        run: unzip -q DulzFluu.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - run: cp proj/app/build/outputs/apk/debug/app-debug.apk DulzFluu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DulzFluu-APK
          path: DulzFluu.apk
          if-no-files-found: error
